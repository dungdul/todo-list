<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
</head>
<body>
  <div class="sidebar">
    <div class="top-menu">
      <button class="menu-button">Upcoming</button>
    </div>
    <div class="project-menu">
      <button class="menu-button">Project 1</button>
      <button class="menu-button">Project 2</button>
      <button class="menu-button">> Archive</button>
    </div>
  </div>
  <div class="main">
    <div class="header">
      <h1>Project 1</h1>
      <div class="sort-by-container">
        <label for="sort-by">Sort by:</label>
        <select name="sort-by" id="sort-by">
          <option value="due-date">Due Date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </div>
    <div class="section-container">
      <div class="section">
        <ul>
          <li>
            <div class="checkbox-container">
              <input type="checkbox" name="" id="">
            </div>
            <p>Do this</p>
            <p>Priority: Low</p>
          </li>
          <li>
            <div class="checkbox-container">
              <input type="checkbox" name="" id="">
            </div>
            <p>Do this</p>
            <p>Priority: Low</p>
          </li>
        </ul>
      </div>
      <div class="section">
        <h2>ddmmyyyy</h2>
        <ul>
          <li>
            <div class="checkbox-container">
              <input type="checkbox" name="" id="">
            </div>
            <p>Do this</p>
            <p>Priority: Low</p>
            <p class="project-tag">#Project 1</p>
          </li>
          <li>
            <div class="checkbox-container">
              <input type="checkbox" name="" id="">
            </div>
            <p>Do this</p>
            <p>Priority: Low</p>
            <p class="project-tag">#Project 1</p>
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
