<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
</head>
<body>
  <div class="sidebar">
    <div class="top-menu">
      <button class="menu-button" id="home">Home</button>
      <button class="menu-button" id="today">Today</button>
      <button class="menu-button" id="upcoming">Upcoming</button>
      <button class="menu-button" id="overdue">Overdue</button>
      <button class="menu-button" id="completed">Completed</button>
    </div>
    <div class="project-menu">
      <div class="project-container"></div>
    </div>
  </div>
  <div class="main">
    <div class="header">
      <h1></h1>
      <div class="sort-by-container">
        <label for="sort-by">Sort by:</label>
        <select name="sort-by" id="sort-by">
          <option value="due-date">Due Date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </div>
    <div class="todo-list-container"></div>
  </div>
</body>
</html>
